name: Materialize R15.2 Hero asset

on:
  push:
    branches:
      - fix/r15.2-hero-source-asset-20261007
    paths:
      - ".codex/r15.2-hero-b64/**"
permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[hero-built]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: true

      - name: Rebuild exact WebP from staged base64
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .codex/r15.2-hero-b64/00.txt \
            .codex/r15.2-hero-b64/01.txt \
            .codex/r15.2-hero-b64/02.txt \
            .codex/r15.2-hero-b64/03.txt \
            > /tmp/hero-r152.b64

          test "$(wc -c < /tmp/hero-r152.b64)" -eq 31676
          base64 --decode /tmp/hero-r152.b64 > assets/images/hero/hero.webp

          test "$(wc -c < assets/images/hero/hero.webp)" -eq 23756
          test "$(sha256sum assets/images/hero/hero.webp | cut -d' ' -f1)" = "16bda05bed631693caa9eb47a73d133dc7bccf6163a71a71601fbac027c743b0"
          file assets/images/hero/hero.webp | grep -q '1200x547'

      - name: Finalize branch with binary asset only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .codex/r15.2-hero-b64
          rm -f .github/workflows/materialize-r152-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/hero/hero.webp .codex/r15.2-hero-b64 .github/workflows/materialize-r152-hero.yml
          git commit -m "fix: finalize R15.2 Hero source asset [hero-built]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

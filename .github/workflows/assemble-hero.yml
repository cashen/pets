name: Assemble Hero asset

on:
  push:
    branches: [fix/r15.4-exact-user-hero-20261008]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Hero source from restored scene
        run: |
          python -m pip install --disable-pip-version-check --no-input pillow
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/images/hero/hero.webp")
          img = Image.open(src).convert("RGB")
          if img.size != (1200, 547):
              raise SystemExit(f"Unexpected base Hero size: {img.size}; expected (1200, 547)")

          crop = img.crop((0, 55, 1200, 505))
          crop = crop.resize((1256, 471), Image.Resampling.LANCZOS)
          crop.save(src, "WEBP", quality=95, method=6)

          check = Image.open(src)
          check.load()
          if check.size != (1256, 471):
              raise SystemExit(f"Generated Hero size mismatch: {check.size}")
          print(f"Generated Hero: {src} {check.size} {check.mode}")
          PY

      - name: Align Hero source contracts
        run: |
          python <<'PY'
          from pathlib import Path

          exact = {
              "index.html": [
                  ('<meta name="ui-version" content="2026.10.07-r15.2-hero-source-repair">', '<meta name="ui-version" content="2026.10.08-r15.4-exact-user-hero">'),
                  ('./assets/images/hero/hero.webp?v=20261007-r153', './assets/images/hero/hero.webp?v=20261008-r154'),
                  ('width="1200" height="547" fetchpriority="high" decoding="async"', 'width="1256" height="471" fetchpriority="high" decoding="async"'),
              ],
              "css/sections.css": [
                  (".hero-image-frame img{width:100%;aspect-ratio:1200/547;object-fit:cover}", ".hero-image-frame img{width:100%;aspect-ratio:1256/471;object-fit:cover}"),
              ],
              "scripts/validate-site.mjs": [
                  ('read("css/sections.css").includes(".hero-image-frame img{width:100%;aspect-ratio:1200/547;object-fit:cover}")', 'read("css/sections.css").includes(".hero-image-frame img{width:100%;aspect-ratio:1256/471;object-fit:cover}")'),
                  ('readme.includes("2026.10.07-r15.2-hero-source-repair")', 'readme.includes("2026.10.08-r15.4-exact-user-hero")'),
              ],
              "scripts/browser-smoke.spec.mjs": [
                  ("toBe(1200)", "toBe(1256)"),
                  ("toBe(547)", "toBe(471)"),
              ],
              "README.md": [
                  ("2026.10.07-r15.2-hero-source-repair", "2026.10.08-r15.4-exact-user-hero"),
                  ("hero.webp 的实际资源尺寸为 1200×547。", "hero.webp 的实际资源尺寸为 1256×471。"),
              ],
          }

          for name, pairs in exact.items():
              p = Path(name)
              text = p.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Missing expected contract in {name}: {old}")
                  text = text.replace(old, new)
              p.write_text(text, encoding="utf-8")
          p = Path("scripts/validate-site.mjs")
          validator = p.read_text(encoding="utf-8")
          old_line = 'ok(/<img alt="宠物全生命周期数字化服务视觉" src="\\.\\/assets\\/images\\/hero\\/hero\\.webp\\?v=20261007-r153" width="1200" height="547"[^>]*>/.test(html),"hero image intrinsic dimensions contract missing");'
          new_line = 'ok(/<img alt="宠物全生命周期数字化服务视觉" src="\\.\\/assets\\/images\\/hero\\/hero\\.webp\\?v=20261008-r154" width="1256" height="471"[^>]*>/.test(html),"hero image intrinsic dimensions contract missing");'
          if old_line not in validator:
              raise SystemExit("Missing exact Hero validator assertion")
          p.write_text(validator.replace(old_line, new_line), encoding="utf-8")
          PY

          grep -F "2026.10.08-r15.4-exact-user-hero" index.html scripts/validate-site.mjs README.md
          grep -F "1256/471" css/sections.css
          grep -F "toBe(1256)" scripts/browser-smoke.spec.mjs

      - name: Remove temporary assembly workflow
        run: |
          git rm -f .github/workflows/assemble-hero.yml

      - name: Commit assembled Hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/hero/hero.webp index.html css/sections.css scripts/validate-site.mjs scripts/browser-smoke.spec.mjs README.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: replace Hero image with supplied framing"
          git push origin HEAD:fix/r15.4-exact-user-hero-20261008

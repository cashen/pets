name: Assemble exact R15.5 Hero source

on:
  push:
    branches: [fix/r15.5-exact-user-hero-source-20261008]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  assemble:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check --no-input pillow

      - name: Reconstruct exact supplied Hero WebP
        run: |
          python <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          from PIL import Image

          root = Path(".codex/hero-upload")
          parts = sorted(root.glob("part-*.b64"))
          expected_parts = [root / f"part-{i:03d}.b64" for i in range(19)]
          if parts != expected_parts:
              raise SystemExit(f"Hero chunks mismatch: found {[p.name for p in parts]}")

          encoded_parts = [p.read_text(encoding="utf-8").strip() for p in parts]
          expected_b64_len = 165090
          if sum(len(x) for x in encoded_parts) != expected_b64_len:
              raise SystemExit(f"Hero base64 length mismatch: {sum(len(x) for x in encoded_parts)} != {expected_b64_len}")

          # Each repository chunk is independently base64-encoded. Decode each
          # chunk first, then concatenate the original binary payload.
          payload = b"".join(base64.b64decode(x, validate=True) for x in encoded_parts)
          expected_sha256 = "9a38cfdd921575b625ba1a5f687942c2e7582abb34a39724b66500babfb348e5"
          actual_sha256 = hashlib.sha256(payload).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f"Hero binary SHA-256 mismatch: {actual_sha256} != {expected_sha256}")

          target = Path("assets/images/hero/hero.webp")
          target.write_bytes(payload)

          image = Image.open(target)
          image.load()
          if image.size != (1256, 471) or image.mode != "RGB":
              raise SystemExit(f"Hero image contract mismatch: {image.size} {image.mode}")
          pixel_sha256 = hashlib.sha256(image.convert("RGB").tobytes()).hexdigest()
          expected_pixel_sha256 = "7bc46473bf492d18b06095b526c30726ef7114b2447a88cdb5682f9eb44e242c"
          if pixel_sha256 != expected_pixel_sha256:
              raise SystemExit(f"Hero pixel SHA-256 mismatch: {pixel_sha256} != {expected_pixel_sha256}")
          print(f"Hero verified: {target} {image.size} {image.mode} binary_sha256={actual_sha256} pixel_sha256={pixel_sha256}")
          PY

      - name: Apply R15.6 Hero-only changes
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
              "index.html": [
                  ("2026.10.08-r15.4-exact-user-hero", "2026.10.08-r15.6-exact-user-hero-clean"),
                  ("hero.webp?v=20261008-r154", "hero.webp?v=20261008-r156"),
              ],
              "css/sections.css": [
                  ("border:10px solid #fff;", ""),
                  ("background:#EEE5DB;", ""),,
              ],
              "scripts/validate-site.mjs": [
                  ("2026.10.08-r15.4-exact-user-hero", "2026.10.08-r15.6-exact-user-hero-clean"),
                  ("hero.webp\\?v=20261008-r154", "hero.webp\\?v=20261008-r156"),
              ],
              "README.md": [
                  ("2026.10.08-r15.4-exact-user-hero", "2026.10.08-r15.6-exact-user-hero-clean"),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Missing expected source text in {name}: {old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")

          validator = Path("scripts/validate-site.mjs")
          text = validator.read_text(encoding="utf-8")
          needle = 'ok(read("css/sections.css").includes(".hero-image-frame img{width:100%;aspect-ratio:1256/471;object-fit:cover}"),"hero image source-ratio contract missing");'
          assertion = '\nok(!read("css/sections.css").includes("border:10px solid #fff;"),"hero image frame white border must remain absent");'
          if needle not in text:
              raise SystemExit("Hero CSS validator anchor missing")
          assertion2 = '\nok(!read("css/responsive.css").includes("border-width:7px;"),"responsive Hero border-width must remain absent");'
          assertion3 = '\nok(!read("css/sections.css").includes("background:#EEE5DB;"),"hero image frame background must remain absent");'
          if "hero image frame white border must remain absent" not in text:
              text = text.replace(needle, needle + assertion + assertion2 + assertion3)
          validator.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          if "1256×471" not in text:
              text = text.replace("1256×471。", "1256×471。")
          readme.write_text(text, encoding="utf-8")

          progress = Path(".codex/progress/2026.10.08-r15.6-exact-user-hero-clean.md")
          progress.write_text(
              "# R15.6 exact Hero source\n\n"
              "- Source: supplied user Hero PNG, converted only to WebP; no crop or resize.\n"
              "- Hero binary SHA-256: 9a38cfdd921575b625ba1a5f687942c2e7582abb34a39724b66500babfb348e5\n"
              "- Intrinsic size: 1256×471 RGB\n"
              "- Removed the 10px white Hero frame border.\n"
              "- Preserved existing composition, logo, palette, copy and navigation.\n",
              encoding="utf-8",
          )
          PY

      - name: Remove temporary upload chunks and assembly workflow
        run: |
          git rm -f .codex/hero-upload/part-*.b64 .github/workflows/assemble-r155.yml
          test -z "$(find .codex/hero-upload -maxdepth 1 -type f -name 'part-*.b64' -print -quit 2>/dev/null)"

      - name: Commit final R15.5 Hero
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/hero/hero.webp index.html css/sections.css scripts/validate-site.mjs README.md .codex/progress/2026.10.08-r15.6-exact-user-hero-clean.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix: use exact supplied Hero source"
          git push origin HEAD:fix/r15.5-exact-user-hero-source-20261008

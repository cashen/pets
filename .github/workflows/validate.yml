name: Validate site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate-site.mjs
      - name: Validate Wrangler deployment
        run: npx --yes wrangler@4.143.0 deploy --dry-run
      - name: Prepare Playwright runner
        run: npm init -y >/dev/null 2>&1 && npm install --no-save --no-package-lock playwright@1.55.0
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pets-http.log 2>&1 & echo $! > /tmp/pets-http.pid
      - name: Inspect Hero container structure
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends webp ffmpeg
          file assets/images/hero/hero.webp
          webpinfo assets/images/hero/hero.webp || true
          ffprobe -hide_banner assets/images/hero/hero.webp || true
          python3 - <<'PY'
          from pathlib import Path
          b=Path("assets/images/hero/hero.webp").read_bytes()
          print("BYTES", len(b))
          print("HEADER", b[:32].hex(" "))
          print("RIFF_SIZE_FIELD", int.from_bytes(b[4:8],"little"))
          print("RIFF_EXPECTED_SIZE_FIELD", len(b)-8)
          print("WEBP_TYPE", b[8:12])
          pos=12
          while pos+8<=len(b) and pos<512:
              tag=b[pos:pos+4]
              size=int.from_bytes(b[pos+4:pos+8],"little")
              print("CHUNK",pos,tag,size)
              pos += 8 + size + (size & 1)
          PY
      - name: Inspect Hero binary alpha and decoded image
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          im = Image.open("assets/images/hero/hero.webp").convert("RGBA")
          print("HERO_FORMAT", Image.open("assets/images/hero/hero.webp").format)
          print("HERO_SIZE", im.size)
          print("HERO_MODE", im.mode)
          print("HERO_RGB_EXTREMA", im.getchannel("R").getextrema(), im.getchannel("G").getextrema(), im.getchannel("B").getextrema())
          print("HERO_ALPHA_EXTREMA", im.getchannel("A").getextrema())
          print("HERO_ALPHA_UNIQUE", len(im.getchannel("A").getcolors(maxcolors=im.width*im.height+1) or []))
          bbox = im.getchannel("RGB").getbbox()
          print("HERO_RGB_BBOX", bbox)
          PY
      - name: Run browser smoke matrix
        run: npx playwright test scripts/browser-smoke.spec.mjs --workers=1 --reporter=line
